<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="teacher_eval_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>teacher_eval_app</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- CRITICAL: API URL Patching - MUST run before Flutter loads -->
  <script>
    (function() {
      'use strict';
      const host = window.location.hostname;
      let apiBaseUrl = (host !== 'localhost' && !host.includes('192.168') && host !== '127.0.0.1') 
        ? 'https://teacher-eval-4.onrender.com' 
        : 'http://192.168.8.33/teacher-eval';
      
      window.__apiBaseUrl = apiBaseUrl;
      console.log('[CRITICAL] API Base URL set to:', apiBaseUrl);

      // Patch fetch IMMEDIATELY
      const origFetch = window.fetch;
      window.fetch = function(input, init) {
        let url = typeof input === 'string' ? input : input.url;
        if (typeof url === 'string' && host !== 'localhost' && !host.includes('192.168')) {
          url = url.replace(/http:\/\/192\.168\.\d+\.\d+\/teacher-eval/g, apiBaseUrl);
          url = url.replace(/\/teacher-eval\/api\//g, '/api/');
          if (typeof input === 'string') input = url;
          else input.url = url;
          console.log('[FETCH] URL patched to:', url);
        }
        return origFetch.apply(this, arguments);
      };
    })();
  </script>
  
  <!-- Always show UI - Flutter will handle teacher loading based on evaluation status -->
  
  <!-- API Configuration (MUST run before Flutter app loads) -->
  <script src="api-config.js?v=2"></script>
  
  <!-- Evaluation Status Check Script (MUST run before Flutter app) -->
  <script src="eval-status-check.js?v=11"></script>
  
  <!-- Keep Render backend warm -->
  <script src="keep-alive.js?v=1"></script>
</head>
<body>
  <!-- Service Worker Registration for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then((reg) => {
            console.log('Service Worker registered:', reg);
          })
          .catch((err) => {
            console.log('Service Worker registration failed:', err);
          });
      });
    }
  </script>
  
  <!-- Flutter Bootstrap - always load, Flutter will show appropriate message -->
  <script>
    console.log('[Bootstrap] Loading Flutter...');
    const script = document.createElement('script');
    script.src = 'flutter_bootstrap.js';
    script.async = true;
    script.onload = () => console.log('[Bootstrap] flutter_bootstrap.js loaded');
    script.onerror = (e) => console.error('[Bootstrap] flutter_bootstrap.js failed:', e);
    document.head.appendChild(script);
  </script>
</body>
</body>
</html>
